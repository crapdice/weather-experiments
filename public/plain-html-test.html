<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kord Widget Test Page</title>
    <script defer src="/widget/kord-widget.js"></script>
    <style>
        body {
            background-color: #0B0E14;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        h1 {
            color: #00D2FF;
            margin-bottom: 10px;
        }

        p {
            color: #8892b0;
            max-width: 500px;
            line-height: 1.6;
        }

        /* Theming the widget via ::part() */
        kord-feedback-widget::part(trigger) {
            background: linear-gradient(135deg, #FF4B2B 0%, #FFB000 100%);
            border: 2px solid white;
        }

        kord-feedback-widget::part(submit) {
            background: #FF4B2B;
            color: white;
        }

        kord-feedback-widget::part(header) h2 {
            color: #FF4B2B;
        }
    </style>
</head>

<body>
    <h1>Kord Widget: Standalone Verification</h1>
    <p>This page is a plain HTML file. It includes the widget via a single script tag and themes it using standard CSS
        <code>::part()</code> selectors.</p>
    <p><strong>Note:</strong> The widget is being auto-injected by the script; there is no manual
        <code>&lt;kord-feedback-widget&gt;</code> tag on this page.</p>
</body>

</html>
